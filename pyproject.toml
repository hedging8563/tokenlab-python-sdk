[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tokenlab-ai"
version = "0.1.2"
description = "Lightweight Python client for TokenLab discovery, OpenAI-compatible APIs, and native endpoints."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "TokenLab" }
]
keywords = [
  "tokenlab",
  "openai-compatible",
  "responses-api",
  "anthropic-messages",
  "gemini",
  "llm-gateway"
]
dependencies = [
  "httpx>=0.27,<1"
]

[project.urls]
Homepage = "https://tokenlab.sh/docs"
Repository = "https://github.com/hedging8563/tokenlab-python-sdk"
Issues = "https://github.com/hedging8563/tokenlab-python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenlab"]
